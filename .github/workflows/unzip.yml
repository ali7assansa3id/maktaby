name: Unzip and Commit

on:
  push:
    branches: [ main ]

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP file
        run: |
          unzip -o law-office-system.zip
          
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "فك ضغط ملف law-office-system.zip تلقائياً"
          branch: main
